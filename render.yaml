services:
  - type: web
    name: shl-recommender
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "pip install -r requirements.txt && python scripts/ingest_catalog.py"
    startCommand: "python3 -m gunicorn -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: HF_HUB_DISABLE_SYMLINKS_WARNING
        value: "1"
      - key: GROQ_API_KEY
        sync: false
